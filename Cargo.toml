[workspace]
resolver = "3"
members = [
    "crates/lzh-hole-types",
    "crates/lzh-hole-store",
    "crates/lzh-hole-protocol",
    "crates/lzh-hole-discovery",
    "crates/lzh-hole-net",
    "crates/lzh-hole-control",
    "crates/lzh-hole-service",
    "crates/lzh-hole",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
lzh-hole-types = { path = "crates/lzh-hole-types" }
lzh-hole-store = { path = "crates/lzh-hole-store" }
lzh-hole-protocol = { path = "crates/lzh-hole-protocol" }
lzh-hole-discovery = { path = "crates/lzh-hole-discovery" }
lzh-hole-net = { path = "crates/lzh-hole-net" }
lzh-hole-control = { path = "crates/lzh-hole-control" }
lzh-hole-service = { path = "crates/lzh-hole-service" }
base32 = "0.5"
clap = { version = "4.6", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.4"
hex = "0.4"
http = "1"
httpdate = "1"
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6"
subtle = "2.6"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["codec", "io", "rt"] }
toml = "1.2"
zeroize = "1.9"
